# Pushing a tag like v1.4.0 builds a signed release APK and creates a
# *draft* GitHub release with it. Add the notes and publish it by hand.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    the .jks keystore, base64-encoded
#   KEYSTORE_PASSWORD  storePassword from key.properties
#   KEY_PASSWORD       keyPassword from key.properties
#   KEY_ALIAS          keyAlias from key.properties
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in pubspec.yaml
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitforge.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/fitforge.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "fitforge-$GITHUB_REF_NAME.apk"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: fitforge-${{ github.ref_name }}.apk

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/fitforge.jks"
