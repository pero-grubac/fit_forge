name: fit_forge
description: FitForge
version: 1.3.0+5
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.4

  # Local database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # Exercise images and links
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2

  flutter_native_splash: ^2.4.1
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.0.0
  timezone: 0.11.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.4.0+3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#00030E"
  image: assets/images/logo.png
  android: true
  ios: true
  android_12:
    color: "#00030E"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#00030E"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21